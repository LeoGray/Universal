name: Fork validation and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*-leogray.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: git submodule update --init src/EXTM3U src/WebVTT src/LRC
      - run: npm ci --ignore-scripts
      - run: npm run build:fork
      - run: npm run test:fork
      - uses: actions/upload-artifact@v4
        with:
          name: dualsubs-fork
          path: dist/
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" dist/* --title "DualSubs $GITHUB_REF_NAME" --notes-file FORK-RELEASE.md --latest
